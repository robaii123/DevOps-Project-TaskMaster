services:
  web:
    build: .
    ports:
    - "8080:5000"
    environment:
      - APP_ENV=development
      - DB_HOST=db
      - DB_NAME=taskdb
      - DB_USER=postgres
      - DB_PASS=secretpassword

    depends_on:
      - db
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=taskdb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=secretpassword
    volumes:
      - pgdata:/var/lib/postgresql/data