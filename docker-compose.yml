services:
  web:
    build: .
    ports:
    - "8080:5000"
    environment:
      - APP_ENV=development
      - DB_HOST=db
      - DB_NAME=taskdb
      - DB_USER=postgres
      - DB_PASS=secretpassword

    depends_on:
      db:
        condition: service_healthy
        
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=taskdb
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=secretpassword
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d taskdb"]
      interval: 3s
      timeout: 3s
      retries: 5
  
volumes:
  pgdata: