name: DevSecOps pipeline

on:
  push:
    branches: [ main, dev]
    paths-ignore:
      - README.md
  pull_request:
    branches: [ main ]
    paths-ignore:
      - README.md*


jobs:
  quality-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: taskdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: secretpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Configurer Python et le Cache Pip
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Installer les dependances (Prod + Dev)
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Verifier la qualite du code (Linter Flake8)
        # Verifie les erreurs de syntaxe ....
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Lancer le test et le base de données (postgres)
        env:
          DB_HOST: localhost
          DB_NAME: taskdb
          DB_USER: postgres
          DB_PASS: secretpassword
        run: pytest

  build-scan-push:
    runs-on: ubuntu-latest
    needs: quality-test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Activer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construire l'image Docker avec Cache
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/taskmaster:latest
            ${{ secrets.DOCKER_USERNAME }}/taskmaster:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


      - name: Scanner l'image avec Trivy (DevSecOps)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKER_USERNAME }}/taskmaster:latest'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

      - name: Se connecter a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Pousser les 2 tags sur Docker Hub
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
        run: |
          docker push $DOCKER_USER/taskmaster:latest
          docker push $DOCKER_USER/taskmaster:${{ github.sha }} 
  deploy:
    runs-on: ubuntu-latest
    needs: build-scan-push
    
    steps:
      - name: Deploy The Code to Render
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"