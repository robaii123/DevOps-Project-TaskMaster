name: DevSecOps pipeline

on:
  push:
    branches: [ main, dev]
    path-ignore:
      - README.md
  pull_request:
    branches: [ main ]
    path-ignore:
      - README.md*


jobs:
  quality-test:
    runs-on: ubuntu-latest

    services:
      image: postgres:16-alpine
      env:
        POSTGRES_DB= taskdb
        POSTGRES_USER= postgres
        POSTGRES_PASSWORD= secretpassword
      ports:
        - 5432:5432
      options: >-
        --health-cmd pg_isready
        --health-interval 5s
        --health-timeout 5s
        --health-retries 5
    
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer les dependencies
        run: pip install -r requirements.txt

      - name: Verifier la qualite du code (Linter Flake8)
        # Verifie les erreurs de syntaxe ....
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Lancer le test et le base de données (postgres)
        env:
          DB_HOST: localhost
          DB_NAME: taskdb
          DB_USER: postgres
          DB_PASSWORD: secretpassword
        run: pytest

  build-scan-push:
    runs-on: ubuntu-latest
    need: quality-test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Construire l'image Docker (Double Tag ${{:}} latest + commit SHA)
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
        run: |
          docker build \
            -t $DOCKER_USER/taskmaster:latest \
            -t $DOCKER_USER/taskmaster:${{ github.sha }} .

      - name: Scanner l'image avec Trivy (DevSecOps)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: '${{ secrets.DOCKER_USERNAME }}/taskmaster:latest'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0' # Affiche un rapport complet dans les logs sans bloquer

      - name: Se connecter a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Pousser les 2 tags sur Docker Hub
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USERNAME }}
        run: |
          docker push $DOCKER_USER/taskmaster:latest
          docker push $DOCKER_USER/taskmaster:${{ github.sha }} 